<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDET Keyword & Stack Alignment Scanner | Global Tech Career</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #030712;
      --card-dark: #090d16;
      --border-dark: #1e293b;
      --cyan-bright: #22d3ee;
      --emerald-bright: #34d399;
    }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: #090d16; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="antialiased">

  <div class="w-full max-w-3xl bg-[#090d16] border-2 border-cyan-500/70 rounded-2xl p-5 sm:p-7 shadow-2xl shadow-cyan-950/40 space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-cyan-950 border border-cyan-800 text-cyan-400">
            <i class="fa-solid fa-flask mr-1"></i> Interactive Lab 01
          </span>
          <span class="text-xs text-slate-400 font-semibold">Global Tech Career</span>
        </div>
        <h1 class="text-lg sm:text-xl font-bold text-white tracking-tight">SDET Keyword & Stack Alignment Scanner</h1>
        <p class="text-xs text-slate-400">Evaluate technical keyword density against deterministic Greenhouse/Lever ATS parameters.</p>
      </div>
      <button onclick="loadSampleJD()" class="self-start sm:self-auto text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700 font-semibold transition flex items-center gap-1.5 flex-shrink-0">
        <i class="fa-solid fa-file-import"></i> Load Sample JD
      </button>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Target U.S. Job Description:</label>
      <textarea id="jd-input" rows="5" class="w-full bg-[#030712] border border-slate-700 focus:border-cyan-400 rounded-xl p-3 text-xs text-white placeholder-slate-500 font-mono transition focus:outline-none custom-scroll" placeholder="Paste U.S. SDET Job Description here..."></textarea>
    </div>

    <div class="flex items-center gap-2.5">
      <button onclick="analyzeJD()" class="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold transition shadow-lg shadow-cyan-500/20 flex items-center gap-2">
        <i class="fa-solid fa-bolt"></i> Analyze Stack & Extract Signals
      </button>
      <button onclick="clearJD()" class="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs font-medium transition">
        Clear
      </button>
    </div>

    <div id="jd-results" class="hidden pt-4 border-t border-slate-800 space-y-3">
      <div id="jd-score-banner" class="text-sm font-bold text-white"></div>
      <div class="text-[11px] text-slate-400 font-semibold uppercase tracking-wider">Extracted Engineering Signals:</div>
      <div id="jd-chips" class="flex flex-wrap gap-1.5"></div>
    </div>
  </div>

  <script>
    const sampleJD = `Senior SDET / Quality Automation Architect (Remote - US)
Required:
- 5+ years architecting test automation frameworks with TypeScript and Playwright.
- Hands-on experience with API integration testing, Docker, and CI/CD pipelines (GitHub Actions).
- Proven track record reducing flaky tests, test sharding, and improving release velocity.
- Microservices, contract testing (Pact), performance (k6), and cloud infrastructure (AWS).`;

    const coreTokens = ["Playwright", "TypeScript", "Python", "CI/CD", "GitHub Actions", "Docker", "Pact", "Contract Testing", "Sharding", "Parallel", "Flaky", "k6", "Performance", "Algorithms"];

    function loadSampleJD() {
      document.getElementById("jd-input").value = sampleJD;
      analyzeJD();
    }
    function clearJD() {
      document.getElementById("jd-input").value = "";
      document.getElementById("jd-results").classList.add("hidden");
    }
    function analyzeJD() {
      const text = document.getElementById("jd-input").value.toLowerCase();
      if (!text.trim()) { alert("Please paste a Job Description first."); return; }
      let found = 0;
      const chips = document.getElementById("jd-chips");
      chips.innerHTML = "";
      coreTokens.forEach(tok => {
        const m = text.includes(tok.toLowerCase());
        const span = document.createElement("span");
        span.className = "px-2.5 py-1 rounded-md text-xs font-bold " + (m ? "bg-emerald-950 text-emerald-300 border border-emerald-600" : "bg-slate-900 text-slate-500 border border-slate-800");
        span.innerText = (m ? "✓ " : "○ ") + tok;
        chips.appendChild(span);
        if (m) found++;
      });
      const score = Math.round((found / coreTokens.length) * 100);
      document.getElementById("jd-score-banner").innerHTML = `ATS Alignment Match: <span class="${score >= 70 ? 'text-emerald-400' : 'text-amber-400'} font-extrabold text-base">${score}%</span> (${found}/${coreTokens.length} Signals Detected)`;
      document.getElementById("jd-results").classList.remove("hidden");
    }
  </script>

</body>
</html>
