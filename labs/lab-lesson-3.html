<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-Element CAR-M Bullet Builder | Global Tech Career</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #030712;
      --card-dark: #090d16;
      --border-dark: #1e293b;
      --cyan-bright: #22d3ee;
      --emerald-bright: #34d399;
    }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: #090d16; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="antialiased">

  <div class="w-full max-w-3xl bg-[#090d16] border-2 border-cyan-500/70 rounded-2xl p-5 sm:p-7 shadow-2xl shadow-cyan-950/40 space-y-4">
    <div class="border-b border-slate-800 pb-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-cyan-950 border border-cyan-800 text-cyan-400">
          <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Interactive Lab 03
        </span>
        <span class="text-xs text-slate-400 font-semibold">Global Tech Career</span>
      </div>
      <h1 class="text-lg sm:text-xl font-bold text-white tracking-tight">4-Element CAR-M Bullet Builder</h1>
      <p class="text-xs text-slate-400">Construct high-impact engineering accomplishments: [Action] + [Scope] + [Tool] + [Metric].</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
      <div>
        <label class="block font-semibold text-slate-300 mb-1">1. Action Verb:</label>
        <input type="text" id="bm-act" value="Architected" oninput="updateBullet()" class="w-full bg-[#030712] border border-slate-700 rounded-lg p-2 text-white focus:border-cyan-400 focus:outline-none">
      </div>
      <div>
        <label class="block font-semibold text-slate-300 mb-1">2. Architecture & Scope:</label>
        <input type="text" id="bm-sc" value="a distributed end-to-end regression framework across 12 microservices" oninput="updateBullet()" class="w-full bg-[#030712] border border-slate-700 rounded-lg p-2 text-white focus:border-cyan-400 focus:outline-none">
      </div>
      <div>
        <label class="block font-semibold text-slate-300 mb-1">3. Stack & Infrastructure:</label>
        <input type="text" id="bm-tl" value="using Playwright, TypeScript, and Docker on AWS Fargate" oninput="updateBullet()" class="w-full bg-[#030712] border border-slate-700 rounded-lg p-2 text-white focus:border-cyan-400 focus:outline-none">
      </div>
      <div>
        <label class="block font-semibold text-slate-300 mb-1">4. Measurable Engineering Metric:</label>
        <input type="text" id="bm-me" value="reducing CI/CD cycle duration from 52m to 14m (73% speedup)" oninput="updateBullet()" class="w-full bg-[#030712] border border-slate-700 rounded-lg p-2 text-white focus:border-cyan-400 focus:outline-none">
      </div>
    </div>

    <div class="bg-[#030712] border border-slate-800 rounded-xl p-4 space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-[10px] font-bold uppercase tracking-wider text-cyan-400">Live Resume Output (Copy-Ready):</span>
        <button onclick="copyBullet()" id="btn-copy-b" class="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700 transition">
          <i class="fa-regular fa-copy mr-1"></i> Copy
        </button>
      </div>
      <div id="bullet-out" class="text-xs text-slate-200 font-mono leading-relaxed bg-[#090d16] p-3 rounded-lg border border-slate-800"></div>
    </div>
  </div>

  <script>
    function updateBullet() {
      const a = document.getElementById("bm-act").value.trim();
      const s = document.getElementById("bm-sc").value.trim();
      const t = document.getElementById("bm-tl").value.trim();
      const m = document.getElementById("bm-me").value.trim();
      document.getElementById("bullet-out").innerText = `${a} ${s} ${t}, ${m}.`;
    }
    function copyBullet() {
      const text = document.getElementById("bullet-out").innerText;
      navigator.clipboard.writeText(text);
      const b = document.getElementById("btn-copy-b");
      b.innerHTML = '<i class="fa-solid fa-check mr-1 text-emerald-400"></i> Copied!';
      setTimeout(() => b.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> Copy', 1800);
    }
    updateBullet();
  </script>

</body>
</html>
