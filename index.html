<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Tech Career | Interactive Engineering Labs</title>
  <style>
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .box {
      max-width: 500px;
      padding: 32px;
      border: 1px solid #1e293b;
      border-radius: 16px;
      background: #090d16;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .logo {
      display: inline-block;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      line-height: 48px;
      font-weight: 900;
      font-size: 18px;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin: 0 0 8px 0; color: #fff; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 0 0 20px 0; }
    a {
      display: inline-block;
      background: #06b6d4;
      color: #030712;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">GTC</div>
    <h1>Global Tech Career</h1>
    <p>This domain hosts interactive laboratory environments and engineering assessment stations for students enrolled in our technical playbooks.</p>
    <a href="https://globaltechcareer.com">Visit Official Website &rarr;</a>
  </div>
</body>
</html>
