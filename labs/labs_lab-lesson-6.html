<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Contract Specification Validator | Global Tech Career</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #030712;
      --card-dark: #090d16;
      --border-dark: #1e293b;
      --cyan-bright: #22d3ee;
      --emerald-bright: #34d399;
    }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: #090d16; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="antialiased">

  <div class="w-full max-w-3xl bg-[#090d16] border-2 border-cyan-500/70 rounded-2xl p-5 sm:p-7 shadow-2xl shadow-cyan-950/40 space-y-4">
    <div class="border-b border-slate-800 pb-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-cyan-950 border border-cyan-800 text-cyan-400">
          <i class="fa-solid fa-handshake mr-1"></i> Interactive Lab 06
        </span>
        <span class="text-xs text-slate-400 font-semibold">Global Tech Career</span>
      </div>
      <h1 class="text-lg sm:text-xl font-bold text-white tracking-tight">API Contract Specification Validator (Pact)</h1>
      <p class="text-xs text-slate-400">Validate consumer interaction JSON boundaries and verify provider compatibility.</p>
    </div>

    <div>
      <div class="flex justify-between items-center mb-1 text-xs">
        <label class="font-semibold text-slate-300 uppercase tracking-wider">Consumer-Driven Pact JSON Definition:</label>
        <button onclick="loadSampleContract()" class="text-cyan-400 hover:underline">Load Sample</button>
      </div>
      <textarea id="contract-json" rows="7" class="w-full bg-[#030712] border border-slate-700 rounded-lg p-3 text-xs text-white font-mono focus:border-cyan-400 focus:outline-none custom-scroll"></textarea>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="validateContract()" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-lg transition">
        Validate Schema & Can-I-Deploy
      </button>
      <div id="contract-status" class="text-xs font-mono text-slate-400"></div>
    </div>
  </div>

  <script>
    const sampleContract = {
      consumer: { name: "WebCheckoutApp" },
      provider: { name: "PaymentGatewayService" },
      interaction: {
        description: "Charge $49.00 subscription transaction",
        request: { method: "POST", path: "/v1/charges", body: { amount: 4900, currency: "USD" } },
        response: { status: 201, body: { id: "ch_99812", status: "SUCCEEDED" } }
      }
    };

    function loadSampleContract() {
      document.getElementById("contract-json").value = JSON.stringify(sampleContract, null, 2);
      validateContract();
    }
    function validateContract() {
      try {
        const val = JSON.parse(document.getElementById("contract-json").value);
        if (val.consumer && val.provider && val.interaction) {
          document.getElementById("contract-status").innerHTML = '<span class="text-emerald-400 font-bold">✓ Contract Validated: Compatible with Pact Broker (Can-I-Deploy: PASS)</span>';
        } else {
          document.getElementById("contract-status").innerHTML = '<span class="text-amber-400 font-bold">⚠ Missing required keys (consumer, provider, interaction).</span>';
        }
      } catch (e) {
        document.getElementById("contract-status").innerHTML = '<span class="text-rose-400 font-bold">✕ JSON Syntax Error</span>';
      }
    }
    loadSampleContract();
  </script>

</body>
</html>
