<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Recruiter Headline & Pitch Studio | Global Tech Career</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #030712;
      --card-dark: #090d16;
      --border-dark: #1e293b;
      --cyan-bright: #22d3ee;
      --emerald-bright: #34d399;
    }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: #090d16; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="antialiased">

  <div class="w-full max-w-3xl bg-[#090d16] border-2 border-cyan-500/70 rounded-2xl p-5 sm:p-7 shadow-2xl shadow-cyan-950/40 space-y-4">
    <div class="border-b border-slate-800 pb-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-cyan-950 border border-cyan-800 text-cyan-400">
          <i class="fa-brands fa-linkedin mr-1"></i> Interactive Lab 04
        </span>
        <span class="text-xs text-slate-400 font-semibold">Global Tech Career</span>
      </div>
      <h1 class="text-lg sm:text-xl font-bold text-white tracking-tight">LinkedIn Recruiter Headline & Pitch Studio</h1>
      <p class="text-xs text-slate-400">Optimize character counts and keyword indexing for Boolean recruiter queries in LinkedIn Recruiter.</p>
    </div>

    <div class="space-y-3">
      <div>
        <div class="flex justify-between items-center mb-1 text-xs">
          <label class="font-semibold text-slate-300 uppercase tracking-wider">3-Tier Headline (Max 220 Chars):</label>
          <span id="hl-count" class="font-mono text-cyan-400 font-bold">0 / 220</span>
        </div>
        <input type="text" id="hl-input" maxlength="220" oninput="updateHeadline()" value="Senior SDET | TypeScript, Playwright, Docker & GitHub Actions | Slashing CI Pipeline Execution from 52m to 14m" class="w-full bg-[#030712] border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:border-cyan-400 focus:outline-none font-mono">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Quick InMail Salary Qualification Pitch:</label>
        <textarea id="inmail-input" rows="4" class="w-full bg-[#030712] border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:border-cyan-400 focus:outline-none font-mono custom-scroll">Hi [Recruiter], thanks for reaching out. I'm actively exploring Senior/Staff SDET opportunities with approved salary bands starting at $150k+ USD (100% remote). My core architecture stack centers on Playwright, TypeScript, and CI matrix sharding. If there's mutual alignment with this band, I'd welcome a conversation!</textarea>
      </div>

      <div class="flex gap-2">
        <button onclick="copyItem('hl-input')" class="text-xs px-3 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold transition">
          Copy Headline
        </button>
        <button onclick="copyItem('inmail-input')" class="text-xs px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold transition">
          Copy InMail Pitch
        </button>
      </div>
    </div>
  </div>

  <script>
    function updateHeadline() {
      const len = document.getElementById("hl-input").value.length;
      document.getElementById("hl-count").innerText = `${len} / 220`;
      if (len > 200) {
        document.getElementById("hl-count").className = "font-mono text-amber-400 font-bold";
      } else {
        document.getElementById("hl-count").className = "font-mono text-cyan-400 font-bold";
      }
    }
    function copyItem(id) {
      const val = document.getElementById(id).value;
      navigator.clipboard.writeText(val);
      alert("Copied to clipboard!");
    }
    updateHeadline();
  </script>

</body>
</html>
